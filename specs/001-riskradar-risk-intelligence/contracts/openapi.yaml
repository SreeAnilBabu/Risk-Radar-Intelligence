openapi: 3.1.0
info:
  title: RiskRadar Risk Intelligence API
  version: 1.0.0
  description: >-
    Mock-data API contract for hackathon implementation. Covers required endpoints
    for dashboard, map, alerts, simulator, drill-down, and AI experiences.
servers:
  - url: http://localhost:4000
    description: Local backend

tags:
  - name: Risks
  - name: Matters
  - name: Jurisdictions
  - name: Alerts
  - name: Vendors
  - name: AI

paths:
  /api/risks:
    get:
      tags: [Risks]
      summary: List jurisdiction risk profiles
      operationId: listRisks
      responses:
        '200':
          description: Risk profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JurisdictionRiskProfile'
                  refreshedAt:
                    type: string
                    format: date-time
                required: [data, refreshedAt]

  /api/risks/{jurisdictionId}:
    get:
      tags: [Risks]
      summary: Get risk profile by jurisdiction
      operationId: getRiskByJurisdiction
      parameters:
        - $ref: '#/components/parameters/JurisdictionId'
      responses:
        '200':
          description: Jurisdiction risk profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JurisdictionRiskProfile'
                required: [data]
        '404':
          $ref: '#/components/responses/NotFound'

  /api/risks/trends:
    get:
      tags: [Risks]
      summary: Get risk trend points
      operationId: getRiskTrends
      parameters:
        - name: jurisdictionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Trend points for one or more jurisdictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskTrendPoint'
                required: [data]

  /api/matters:
    get:
      tags: [Matters]
      summary: List matter risk records
      operationId: listMatters
      parameters:
        - name: jurisdictionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matter records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatterRiskRecord'
                required: [data]

  /api/matters/{id}:
    get:
      tags: [Matters]
      summary: Get matter by id
      operationId: getMatterById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matter record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MatterRiskRecord'
                required: [data]
        '404':
          $ref: '#/components/responses/NotFound'

  /api/jurisdictions:
    get:
      tags: [Jurisdictions]
      summary: List available jurisdictions
      operationId: listJurisdictions
      responses:
        '200':
          description: Jurisdiction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Jurisdiction'
                required: [data]

  /api/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      operationId: listAlerts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AlertStatus'
      responses:
        '200':
          description: Alert list with queue ordering applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskAlert'
                  counters:
                    $ref: '#/components/schemas/AlertCounters'
                required: [data, counters]

  /api/alerts/{id}:
    patch:
      tags: [Alerts]
      summary: Update alert lifecycle state
      operationId: patchAlert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAlertRequest'
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RiskAlert'
                  counters:
                    $ref: '#/components/schemas/AlertCounters'
                required: [data, counters]
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vendors:
    get:
      tags: [Vendors]
      summary: List vendor risk summaries
      operationId: listVendors
      responses:
        '200':
          description: Vendor summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VendorRiskSummary'
                required: [data]

  /api/ai/briefing:
    post:
      tags: [AI]
      summary: Generate executive daily briefing
      operationId: postAIBriefing
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIBriefingRequest'
      responses:
        '200':
          description: AI briefing output
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AIBriefing'
                required: [data]

  /api/ai/query:
    post:
      tags: [AI]
      summary: Ask contextual follow-up risk query
      operationId: postAIQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIQueryRequest'
      responses:
        '200':
          description: Contextual AI answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AIQueryResponse'
                required: [data]
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ai/simulate:
    post:
      tags: [AI]
      summary: Run what-if simulation with nearest-preset fallback
      description: >-
        For unsupported prompts, server returns nearest preset approximation and
        a required disclaimer field.
      operationId: postAISimulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        '200':
          description: Simulation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SimulationResult'
                required: [data]
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    JurisdictionId:
      name: jurisdictionId
      in: path
      required: true
      schema:
        type: string
      description: Jurisdiction identifier (example US-CA)

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RiskLevel:
      type: string
      enum: [low, medium, high, critical]

    TrendDirection:
      type: string
      enum: [falling, stable, rising]

    AlertStatus:
      type: string
      enum: [unread, read, snoozed, escalated]

    RiskFactorContribution:
      type: object
      properties:
        financialExposure: { type: number, minimum: 0, maximum: 100 }
        matterComplexity: { type: number, minimum: 0, maximum: 100 }
        deadlinePressure: { type: number, minimum: 0, maximum: 100 }
        regulatoryVolatility: { type: number, minimum: 0, maximum: 100 }
        vendorPerformanceRisk: { type: number, minimum: 0, maximum: 100 }
      required:
        - financialExposure
        - matterComplexity
        - deadlinePressure
        - regulatoryVolatility
        - vendorPerformanceRisk
      description: Inputs for FR-021 weighted score formula

    Jurisdiction:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
      required: [id, name, code]

    JurisdictionRiskProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        overallRiskScore: { type: number, minimum: 0, maximum: 100 }
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        trendDirection:
          $ref: '#/components/schemas/TrendDirection'
        topRiskFactors:
          $ref: '#/components/schemas/RiskFactorContribution'
        matterCount: { type: integer, minimum: 0 }
        totalSpend: { type: number, minimum: 0 }
        openAlerts: { type: integer, minimum: 0 }
        geometryRef: { type: string }
        lastUpdatedAt: { type: string, format: date-time }
      required:
        - id
        - name
        - code
        - overallRiskScore
        - riskLevel
        - trendDirection
        - topRiskFactors
        - matterCount
        - totalSpend
        - openAlerts
        - geometryRef
        - lastUpdatedAt

    RiskTrendPoint:
      type: object
      properties:
        id: { type: string }
        jurisdictionId: { type: string }
        timestamp: { type: string, format: date-time }
        score: { type: number, minimum: 0, maximum: 100 }
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
      required: [id, jurisdictionId, timestamp, score, riskLevel]

    MatterRiskRecord:
      type: object
      properties:
        id: { type: string }
        jurisdictionId: { type: string }
        title: { type: string }
        practiceArea: { type: string }
        status:
          type: string
          enum: [open, at_risk, closed]
        riskScore: { type: number, minimum: 0, maximum: 100 }
        spendToDate: { type: number, minimum: 0 }
        outsideCounselVendorId: { type: string }
        deadlineAt: { type: string, format: date-time }
        summary: { type: string }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - jurisdictionId
        - title
        - practiceArea
        - status
        - riskScore
        - spendToDate
        - outsideCounselVendorId
        - summary
        - updatedAt

    RiskAlert:
      type: object
      properties:
        id: { type: string }
        jurisdictionId: { type: string }
        matterId: { type: string }
        type:
          type: string
          enum: [threshold_breach, regulatory_change, spend_anomaly, deadline_risk]
        severity:
          $ref: '#/components/schemas/RiskLevel'
        status:
          $ref: '#/components/schemas/AlertStatus'
        message: { type: string }
        recommendedAction: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        escalatedAt: { type: string, format: date-time }
      required:
        - id
        - jurisdictionId
        - type
        - severity
        - status
        - message
        - recommendedAction
        - createdAt
        - updatedAt

    AlertCounters:
      type: object
      properties:
        unread: { type: integer, minimum: 0 }
        snoozed: { type: integer, minimum: 0 }
        escalated: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
      required: [unread, snoozed, escalated, total]

    PatchAlertRequest:
      type: object
      properties:
        action:
          type: string
          enum: [mark_read, snooze, escalate]
      required: [action]

    VendorRiskSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        activeMatterCount: { type: integer, minimum: 0 }
        totalSpend: { type: number, minimum: 0 }
        performanceRiskScore: { type: number, minimum: 0, maximum: 100 }
        billingAnomalyCount: { type: integer, minimum: 0 }
        jurisdictionIds:
          type: array
          items: { type: string }
      required:
        - id
        - name
        - activeMatterCount
        - totalSpend
        - performanceRiskScore
        - billingAnomalyCount
        - jurisdictionIds

    AIBriefingRequest:
      type: object
      properties:
        focus:
          type: string
          enum: [daily, jurisdiction, board]
        jurisdictionIds:
          type: array
          items: { type: string }

    AIBriefing:
      type: object
      properties:
        id: { type: string }
        generatedAt: { type: string, format: date-time }
        topRisks:
          type: array
          items: { type: string }
        changesSinceYesterday:
          type: array
          items: { type: string }
        recommendedActions:
          type: array
          items: { type: string }
        narrative: { type: string }
        latencyMs: { type: integer, minimum: 0 }
      required:
        - id
        - generatedAt
        - topRisks
        - changesSinceYesterday
        - recommendedActions
        - narrative
        - latencyMs

    AIQueryRequest:
      type: object
      properties:
        question: { type: string, minLength: 3 }
        context:
          type: object
          additionalProperties: true
      required: [question]

    AIQueryResponse:
      type: object
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        relatedJurisdictionIds:
          type: array
          items: { type: string }
        relatedMatterIds:
          type: array
          items: { type: string }
        suggestedNextQuestions:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
      required:
        - id
        - question
        - answer
        - relatedJurisdictionIds
        - relatedMatterIds
        - suggestedNextQuestions
        - generatedAt

    SimulationRequest:
      type: object
      properties:
        prompt: { type: string, minLength: 3 }
        baselineJurisdictionIds:
          type: array
          items: { type: string }
      required: [prompt]

    ProjectedRiskChange:
      type: object
      properties:
        jurisdictionId: { type: string }
        beforeScore: { type: number, minimum: 0, maximum: 100 }
        afterScore: { type: number, minimum: 0, maximum: 100 }
        delta: { type: number }
        beforeLevel:
          $ref: '#/components/schemas/RiskLevel'
        afterLevel:
          $ref: '#/components/schemas/RiskLevel'
      required:
        - jurisdictionId
        - beforeScore
        - afterScore
        - delta
        - beforeLevel
        - afterLevel

    SimulationResult:
      type: object
      properties:
        requestId: { type: string }
        inputPrompt: { type: string }
        matchedPresetId: { type: string }
        isApproximation: { type: boolean }
        disclaimer: { type: string }
        projectedJurisdictionChanges:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedRiskChange'
        projectedFinancialImpact: { type: number }
        recommendedMitigations:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
      required:
        - requestId
        - inputPrompt
        - matchedPresetId
        - isApproximation
        - projectedJurisdictionChanges
        - projectedFinancialImpact
        - recommendedMitigations
        - generatedAt
      allOf:
        - if:
            properties:
              isApproximation:
                const: true
          then:
            required: [disclaimer]

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
